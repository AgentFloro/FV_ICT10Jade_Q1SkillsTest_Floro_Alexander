<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills test</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <style>
        header{
            font-weight: bolder;
            color: rgb(0, 0, 0);
            
            text-align: center;
            font-size: 30px;
        }
        form{
            border-radius: 50px;
            background-color: rgb(218, 79, 79);
            color:rgb(207, 219, 230);
            text-align: center;
    
            margin-top: auto;
            margin-bottom: auto;
            margin-left: auto;
            margin-right: auto;
            width: 500px;
            height: 240px;
            
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-image: url(https://img.magnific.com/free-photo/wooden-planks-with-blurred-restaurant-background_1253-56.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
        .output1{
            border-radius: 50px;
            background-color: rgb(218, 79, 79);
            color:rgb(207, 219, 230);
            text-align: center;
        }

    </style>

</head>
<body>
    <header>
        <h1>
            Mastard Shack
        </h1>
      <h2>Menu & Order</h2>
    </header>

    


    <form>
    <br>
        <label for="options">Select main course</label>
       <br>
       <select id="Main">
        <option value="0">Choose an option</option>
        <option value="100">Pasta</option>
        <option value="200">Club Sandwich</option>
        <option value="300">baby steak</option>
       </select>
       <br><br>
       <label for="options">Select your Appetizers</label>
       <br>
       <select id="Appetize">
        <option value="0">Choose an option</option>
        <option value="50">FrenchFries</option>
        <option value="100">Calamari</option>
        <option value="75">MozzarelaSticks</option>
       </select>
       <br><br>
       <label for="options">Select your drink</label>
       <br>
       <select id="Drink">
        <option value="0">Choose an option</option>
        <option value="50">Coke Soda</option>
        <option value="0">Water</option>
        <option value="45">Lemonade</option>
        <option value="75">milkshake</option>
       </select>
       <br><br><br>
       <button type="button" py-click="place_order">Place order</button>
    </form>
    <br>
    <div id="output1" class="output1"></div>
    <script type="py" src="main.py"></script>
</body>
</html>
